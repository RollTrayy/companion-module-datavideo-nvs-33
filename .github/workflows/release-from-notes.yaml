name: Release from notes

# Creates the GitHub release as soon as a version tag is pushed, using the notes
# kept in .github/release-notes/<tag>.md. Publishing the release then triggers
# release.yaml, which builds the package and attaches it to the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-notes:
    name: Verify release notes are in the tag

    if: ${{ !contains(github.repository, 'companion-module-template-') }}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      # The release body is read from the tagged commit, so the notes have to be
      # part of that commit. A tag created before the notes were committed would
      # otherwise publish an empty or generated body without anyone noticing.
      # Note that this guard lives in the workflow itself: a tag predating this
      # file cannot run it, so it protects against missing notes, not against a
      # tag that predates the whole release tooling.
      - name: Fail when the notes file is absent from the tagged commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          NOTES=".github/release-notes/${TAG}.md"
          echo "Checking ${TAG} for ${NOTES}"

          if ! git cat-file -e "${TAG}:${NOTES}" 2>/dev/null; then
            echo "::error file=${NOTES}::${NOTES} is missing from the commit tagged ${TAG}"
            echo "Commit the notes and move the tag before pushing it again:"
            echo "  git add ${NOTES} && git commit -m 'Add ${TAG} release notes'"
            echo "  git tag -f -a ${TAG} -m '<message>' HEAD"
            exit 1
          fi

          if [ -z "$(git show "${TAG}:${NOTES}" | tr -d '[:space:]')" ]; then
            echo "::error file=${NOTES}::${NOTES} is empty in ${TAG}"
            exit 1
          fi

          echo "${NOTES} is present in ${TAG}"

  create-release:
    name: Create release
    needs: verify-notes

    if: ${{ !contains(github.repository, 'companion-module-template-') }}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the tag
        uses: actions/checkout@v5

      - name: Create the release from its notes file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists, leaving it untouched."
            exit 0
          fi

          NOTES=".github/release-notes/${TAG}.md"
          TITLE="Datavideo NVS-33 ${TAG#v}"

          # verify-notes has already failed the run if the file is absent or
          # empty, so the release body always comes from the committed notes.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --verify-tag

  # Packaging lives here rather than in release.yaml, which runs on
  # 'release: published'. Events raised with secrets.GITHUB_TOKEN do not start
  # further workflow runs, so a release created by this workflow would never
  # trigger that one and would stay without its package.
  package:
    name: Package module
    needs: create-release

    permissions:
      packages: read

    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
    with:
      git-ref: ${{ github.ref_name }}
      upload-artifact: true

  attach:
    name: Attach package to release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Needed to upload the built package as a release asset
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          # The shared workflow always uploads its package as 'pkg', holding pkg.tgz
          name: pkg

      - name: Attach package to release
        # --clobber lets the workflow be re-run against a release that already has
        # the asset attached.
        run: |
          NAME="${GITHUB_REPOSITORY#*/companion-module-}-${TAG#v}"
          ASSET="${NAME//[^a-zA-Z0-9.-]/-}.tgz"
          mv pkg.tgz "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
